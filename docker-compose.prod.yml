# Production stack: pulls the app images from Docker Hub instead of building them.
# Needs these in .env on the server (in addition to the usual INFLUXDB_*, MQTT_*_PASSWORD, API_KEY, EPOCH):
#   DOCKERHUB_USER=yourdockerhubuser
#   TAG=v1.0.0
# Start:   docker compose -f docker-compose.prod.yml up -d
# Update:  change TAG in .env, then: docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  broker:
    image: eclipse-mosquitto:2
    container_name: iot-broker
    ports:
      - "1883:1883"                       # ESP32 and other LAN clients connect here (auth + ACL enforced)
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./broker/passwd:/mosquitto/config/passwd:ro
      - ./broker/acl:/mosquitto/config/acl:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped
    logging: *logging

  tsdb:
    image: influxdb:2
    container_name: iot-tsdb
    ports:
      - "127.0.0.1:8086:8086"             # reachable from the server itself only; use an SSH tunnel to open the UI
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    restart: unless-stopped
    logging: *logging

  scheduler:
    image: ${DOCKERHUB_USER}/iot-scheduler:${TAG}
    container_name: iot-scheduler
    environment:
      MQTT_HOST: broker
      MQTT_PORT: 1883
      MQTT_USERNAME: scheduler
      MQTT_PASSWORD: ${MQTT_SCHEDULER_PASSWORD}
      INFLUXDB_URL: http://tsdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      STRATEGY: ${STRATEGY:-dynamic}
      EPOCH: ${EPOCH:-2026-10-19T00:00:00+07:00}
    depends_on: [broker, tsdb]
    restart: unless-stopped
    logging: *logging

  api:
    image: ${DOCKERHUB_USER}/iot-api:${TAG}
    container_name: iot-api
    ports:
      - "8000:8000"                       # dashboard and REST API for the LAN. Bind to 127.0.0.1 if you add a reverse proxy.
    environment:
      MQTT_HOST: broker
      MQTT_PORT: 1883
      MQTT_USERNAME: api
      MQTT_PASSWORD: ${MQTT_API_PASSWORD}
      INFLUXDB_URL: http://tsdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      API_KEY: ${API_KEY}
      EPOCH: ${EPOCH:-2026-10-19T00:00:00+07:00}
    depends_on: [broker, tsdb, scheduler]
    restart: unless-stopped
    logging: *logging

  simulator:
    image: ${DOCKERHUB_USER}/iot-simulator:${TAG}
    profiles: ["sim"]                     # only runs when asked: docker compose -f docker-compose.prod.yml run --rm simulator
    environment:
      MQTT_HOST: broker
      MQTT_PORT: 1883
      MQTT_USERNAME: simulator
      MQTT_PASSWORD: ${MQTT_SIMULATOR_PASSWORD}
      EPOCH: ${EPOCH:-2026-10-19T00:00:00+07:00}
      N_HOUSEHOLDS: ${N_HOUSEHOLDS:-10}
      SEED: ${SEED:-0}
      SIM_SPEED: ${SIM_SPEED:-0}
    depends_on: [broker, scheduler]

volumes:
  mosquitto-data:
  influxdb-data:
  influxdb-config: